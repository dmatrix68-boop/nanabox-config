name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
      title:
        description: "Release title (defaults to the tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generator is a single self-contained HTML file, so it is shipped
      # as-is next to a small bundle with the README and the licence. The
      # screenshots under docs/ are deliberately left out: they only serve the
      # README on GitHub and would dominate the download size.
      - name: Build release assets
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/nanabox-config.html
          zip -j "dist/nanabox-config-${TAG}.zip" index.html README.md LICENSE

      # Inputs are passed through the environment rather than interpolated into
      # the script, so a crafted tag or title cannot inject shell commands.
      #
      # Notes come from .github/RELEASE_NOTES.md when it exists — update that
      # file before dispatching, otherwise the previous release's notes are
      # reused. Without the file, GitHub generates notes from the merged pull
      # requests instead.
      - name: Create release or upload assets to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            if [ -f .github/RELEASE_NOTES.md ]; then
              NOTES=(--notes-file .github/RELEASE_NOTES.md)
            else
              NOTES=(--generate-notes)
            fi
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --target "$TARGET" \
              --title "${TITLE:-$TAG}" \
              "${NOTES[@]}"
          fi
